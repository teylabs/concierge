name: postgres

# PostgreSQL evidence only. The run-tests matrix runs on SQLite, where the
# tests/Concurrency race suite skips by design; locking and concurrency
# claims are made by this workflow alone, and it fails if they skip.

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/postgres.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/postgres.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pgsql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        php: [8.5, 8.4]

    name: PostgreSQL 18 - P${{ matrix.php }} - L13

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: concierge
          POSTGRES_PASSWORD: concierge
          # tests/TestCase.php fixes the database name.
          POSTGRES_DB: concierge_test_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U concierge -d concierge_test_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CONCIERGE_TEST_DB: pgsql
      CONCIERGE_TEST_DB_HOST: 127.0.0.1
      CONCIERGE_TEST_DB_PORT: 5432
      CONCIERGE_TEST_DB_USERNAME: concierge
      CONCIERGE_TEST_DB_PASSWORD: concierge

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # pcntl + posix: the race suite forks one process per operation.
          extensions: dom, curl, libxml, mbstring, zip, pcntl, posix, pdo, pdo_pgsql, pgsql, bcmath, intl, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:13.*" "orchestra/testbench:11.*" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Full suite on PostgreSQL
        run: vendor/bin/pest --ci

      - name: Concurrency suite on PostgreSQL (skips fail)
        run: vendor/bin/pest --ci tests/Concurrency --fail-on-skipped
